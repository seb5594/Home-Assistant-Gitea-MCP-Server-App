name: Follow upstream releases

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-${{ github.ref }}
  cancel-in-progress: false

jobs:
  follow:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Update to the latest stable Gitea MCP release
        id: upstream
        run: python3 .github/scripts/upstream.py
      - name: Publish the update through CI
        if: steps.upstream.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitea_mcp_server/{config.yaml,Dockerfile,CHANGELOG.md}
          git commit -m "Update Gitea MCP to $VERSION"
          git push
          # A push with GITHUB_TOKEN does not trigger push workflows.
          gh workflow run ci.yml --ref "$TARGET_BRANCH"
