name: Gitea MCP Server
description: Lets Assist, Claude and ChatGPT work with your Gitea repositories, issues and pull requests through the Model Context Protocol.
version: "1.0.0-dev6"
slug: gitea_mcp_server
stage: experimental
init: false
arch:
  - amd64
  - aarch64
url: https://github.com/seb5594/Home-Assistant-Gitea-MCP-Server-App
hassio_api: true
hassio_role: default
ingress: true
ingress_port: 8099
panel_icon: mdi:source-branch
panel_title: Gitea MCP
map:
  - type: ssl
    read_only: true
ports:
  8080/tcp: null
  8081/tcp: null
ports_description:
  8080/tcp: Local MCP endpoint with the configured access token. Leave closed unless a client outside Home Assistant needs it.
  8081/tcp: Remote MCP endpoint for claude.ai and ChatGPT (OAuth). Normally reached through a tunnel or reverse proxy instead.
options:
  gitea_url: ""
  access_token: ""
  read_only: true
  toolsets: []
  remote_access:
    public_url: ""
    gitea_public_url: ""
  advanced:
    ca_certificate: ""
    ignore_certificate_errors: false
    debug_logging: false
schema:
  gitea_url: str?
  access_token: password?
  read_only: bool
  toolsets:
    - list(actions|branch|commit|file|issue|label|milestone|notification|packages|project|pull_request|release|repository|search|tag|timetracking|user|version|wiki)
  remote_access:
    public_url: str?
    gitea_public_url: str?
  advanced:
    ca_certificate: str?
    ignore_certificate_errors: bool
    debug_logging: bool
