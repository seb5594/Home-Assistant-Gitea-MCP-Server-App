configuration:
  gitea_url:
    name: Gitea address
    description: Address of your Gitea. The default is the Gitea app by alexbelgium. For another app use http://<host name>:3000, for a Gitea elsewhere for example https://git.example.com.
  access_token:
    name: Access token
    description: Personal access token of your Gitea account (Gitea > Settings > Applications > Generate New Token). Home Assistant and other local clients work with the permissions of this token. The app page shows whether it works.
  read_only:
    name: Read-only
    description: On (recommended) hides every tool that creates or changes something. Switch it off only when the token should be allowed to write too.
  toolsets:
    name: Toolsets
    description: Which groups of tools to offer. Leave empty for all of them. A short list keeps the tool list small, which helps voice assistants and saves tokens.
  remote_access:
    name: Remote access for AI services
    description: Optional. Online assistants such as claude.ai, ChatGPT and Claude Code connect over the internet and sign in to Gitea with OAuth; the app page walks you through it. Leave empty to keep the app local.
    fields:
      public_url:
        name: Public MCP address
        description: HTTPS address under which this app is reachable from the internet, without a path, for example https://mcp.example.com. Point your tunnel or reverse proxy at port 8081 of this app.
      gitea_public_url:
        name: Public Gitea address
        description: HTTPS address of your Gitea as seen from the internet, for example https://git.example.com. Leave empty if the Gitea address above is already public.
  advanced:
    name: Advanced
    description: Only needed for a self-signed Gitea certificate and for troubleshooting.
    fields:
      ignore_certificate_errors:
        name: Ignore certificate errors
        description: Accepts any certificate. Only for a Gitea in your own network that you cannot give a trusted certificate.
      debug_logging:
        name: Debug logging
        description: Logs every request sent to Gitea and one line per request to the remote address (method, path, status, User-Agent, never the token). Switch it off again after troubleshooting; the log can contain private data.
network:
  8080/tcp: Local MCP endpoint (access token)
  8081/tcp: Remote MCP endpoint (OAuth)
