# Request log for the remote MCP address. Only used while debug logging is on: nginx listens
# on the remote port, writes one line per request and hands the request on unchanged to the
# MCP server on 8082. The Authorization header is never logged, only whether one was sent.
daemon off;
worker_processes 1;
pid /run/gitea-mcp/nginx.pid;
error_log stderr warn;

events {
  worker_connections 128;
}

http {
  access_log off;
  client_body_temp_path /tmp/gitea-mcp-nginx/body;
  proxy_temp_path /tmp/gitea-mcp-nginx/proxy;

  map $http_authorization $auth_state {
    default "token-sent";
    ""      "none";
  }

  log_format mcp 'request: $request_method $uri -> $status ($body_bytes_sent bytes, $request_time s) agent="$http_user_agent" auth=$auth_state origin="$http_origin" from=$http_cf_connecting_ip';

  server {
    listen 8081;
    access_log /dev/stderr mcp;

    location / {
      proxy_pass http://127.0.0.1:8082;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 1h;
    }
  }
}
